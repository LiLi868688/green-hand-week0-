<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">矩阵乘法与线性变换：一步图解</title><desc id="desc">结果中的每个格子都按“左边一行、右边一列”计算。下方先单独算左上格，不是两个矩阵在同位置直接相乘。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">矩阵乘法与线性变换：一步图解</text><rect x="35" y="90" width="205" height="170" rx="5" fill="#f4f7fb" stroke="#b8c6d6" stroke-width="2"/><rect x="290" y="90" width="205" height="170" rx="5" fill="#f4f7fb" stroke="#b8c6d6" stroke-width="2"/><rect x="545" y="90" width="180" height="170" rx="5" fill="#edf8f1" stroke="#b8c6d6" stroke-width="2"/><text x="135" y="126" font-size="27" text-anchor="middle" fill="#273749">A</text><text x="390" y="126" font-size="27" text-anchor="middle" fill="#273749">B</text><text x="635" y="126" font-size="27" text-anchor="middle" fill="#273749">A × B</text><text x="65" y="180" font-size="31" text-anchor="start" fill="#273749">1</text><text x="150" y="180" font-size="31" text-anchor="start" fill="#273749">2</text><text x="65" y="230" font-size="31" text-anchor="start" fill="#273749">3</text><text x="150" y="230" font-size="31" text-anchor="start" fill="#273749">4</text><text x="320" y="180" font-size="31" text-anchor="start" fill="#273749">2</text><text x="405" y="180" font-size="31" text-anchor="start" fill="#273749">0</text><text x="320" y="230" font-size="31" text-anchor="start" fill="#273749">1</text><text x="405" y="230" font-size="31" text-anchor="start" fill="#273749">2</text><text x="565" y="180" font-size="31" text-anchor="start" fill="#273749">4</text><text x="650" y="180" font-size="31" text-anchor="start" fill="#273749">4</text><text x="565" y="230" font-size="31" text-anchor="start" fill="#273749">10</text><text x="650" y="230" font-size="31" text-anchor="start" fill="#273749">8</text><text x="260" y="195" font-size="30" text-anchor="middle" fill="#273749">×</text><text x="520" y="195" font-size="30" text-anchor="middle" fill="#273749">=</text><rect x="45" y="295" width="670" height="110" rx="5" fill="#eff6ff" stroke="#b8c6d6" stroke-width="2"/><text x="65" y="335" font-size="25" text-anchor="start" fill="#273749">只看左上格：A 的第1行 × B 的第1列</text><text x="65" y="380" font-size="27" text-anchor="start" fill="#273749">[1, 2] · [2, 1] = 1×2 + 2×1 = 4</text></g></svg>