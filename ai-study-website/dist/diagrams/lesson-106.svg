<svg xmlns="http://www.w3.org/2000/svg" width="760" height="542" viewBox="0 0 760 542" role="img" aria-labelledby="title desc"><title id="title">按两个条件筛选组合</title><desc id="desc">前三对保留；最后一对虽然总和对，却不满足全部条件。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="542" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">按两个条件筛选组合</text><rect x="40.0" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="117" font-size="24" text-anchor="start" fill="#273749">x</text><rect x="266.66666666666663" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="117" font-size="24" text-anchor="start" fill="#273749">y</text><rect x="493.3333333333333" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="117" font-size="24" text-anchor="start" fill="#273749">两条条件是否成立</text><rect x="40.0" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="177" font-size="24" text-anchor="start" fill="#273749">0</text><rect x="266.66666666666663" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="177" font-size="24" text-anchor="start" fill="#273749">5</text><rect x="493.3333333333333" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="177" font-size="24" text-anchor="start" fill="#273749">和5，且0&lt;5</text><rect x="40.0" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="245" font-size="24" text-anchor="start" fill="#273749">1</text><rect x="266.66666666666663" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="245" font-size="24" text-anchor="start" fill="#273749">4</text><rect x="493.3333333333333" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="245" font-size="24" text-anchor="start" fill="#273749">和5，且1&lt;4</text><rect x="40.0" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="313" font-size="24" text-anchor="start" fill="#273749">2</text><rect x="266.66666666666663" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="313" font-size="24" text-anchor="start" fill="#273749">3</text><rect x="493.3333333333333" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="313" font-size="24" text-anchor="start" fill="#273749">和5，且2&lt;3</text><rect x="40.0" y="342" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="381" font-size="24" text-anchor="start" fill="#273749">3</text><rect x="266.66666666666663" y="342" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="381" font-size="24" text-anchor="start" fill="#273749">2</text><rect x="493.3333333333333" y="342" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="381" font-size="24" text-anchor="start" fill="#273749">和5，但3&lt;2为假</text><text x="40" y="487" font-size="24" text-anchor="start" fill="#273749">前三对保留；最后一对虽然总和对，却不满足全部条件。</text></g></svg>