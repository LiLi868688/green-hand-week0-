<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">混淆矩阵、精确率、召回率与 F1：一步图解</title><desc id="desc">横着看“被预测为正”的一行，算精确率；竖着看“真实为正”的一列，算召回率。TN在这道题中没有给出，图中不虚构它。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">混淆矩阵、精确率、召回率与 F1：一步图解</text><text x="390" y="90" font-size="25" text-anchor="middle" fill="#273749">真实正类</text><text x="610" y="90" font-size="25" text-anchor="middle" fill="#273749">真实负类</text><rect x="285" y="115" width="200" height="90" rx="5" fill="#e4f0ff" stroke="#b8c6d6" stroke-width="2"/><text x="385" y="168" font-size="26" text-anchor="middle" fill="#273749">TP = 6</text><rect x="505" y="115" width="200" height="90" rx="5" fill="#fff0dd" stroke="#b8c6d6" stroke-width="2"/><text x="605" y="168" font-size="26" text-anchor="middle" fill="#273749">FP = 2</text><rect x="285" y="225" width="200" height="90" rx="5" fill="#fff0dd" stroke="#b8c6d6" stroke-width="2"/><text x="385" y="278" font-size="26" text-anchor="middle" fill="#273749">FN = 4</text><rect x="505" y="225" width="200" height="90" rx="5" fill="#f1f4f8" stroke="#b8c6d6" stroke-width="2"/><text x="605" y="278" font-size="26" text-anchor="middle" fill="#273749">TN 未给出</text><text x="35" y="165" font-size="26" text-anchor="start" fill="#273749">预测正类</text><text x="35" y="275" font-size="26" text-anchor="start" fill="#273749">预测负类</text><text x="40" y="370" font-size="25" text-anchor="start" fill="#273749">精确率：看第一行 → 6/(6+2)=0.75</text><text x="40" y="418" font-size="25" text-anchor="start" fill="#273749">召回率：看第一列 ↓ 6/(6+4)=0.60</text></g></svg>