<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">图像、卷积与池化：一步图解</title><desc id="desc">蓝色两格是第一次读取的窗口。每次向右移动一格，用相同核重新计算；核共享，不是给每个位置另造一套权重。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">图像、卷积与池化：一步图解</text><rect x="80" y="110" width="120" height="80" rx="5" fill="#e4f0ff" stroke="#b8c6d6" stroke-width="2"/><text x="140" y="160" font-size="34" text-anchor="middle" fill="#273749">1</text><rect x="225" y="110" width="120" height="80" rx="5" fill="#e4f0ff" stroke="#b8c6d6" stroke-width="2"/><text x="285" y="160" font-size="34" text-anchor="middle" fill="#273749">3</text><rect x="370" y="110" width="120" height="80" rx="5" fill="#f5f7fa" stroke="#b8c6d6" stroke-width="2"/><text x="430" y="160" font-size="34" text-anchor="middle" fill="#273749">2</text><rect x="515" y="110" width="120" height="80" rx="5" fill="#f5f7fa" stroke="#b8c6d6" stroke-width="2"/><text x="575" y="160" font-size="34" text-anchor="middle" fill="#273749">5</text><text x="80" y="250" font-size="27" text-anchor="start" fill="#273749">先取第一个窗口 [1, 3]</text><text x="80" y="305" font-size="26" text-anchor="start" fill="#273749">与核 [−1, 1] 配对：1×(−1) + 3×1 = 2</text><text x="80" y="370" font-size="26" text-anchor="start" fill="#273749">再右移一格：[3,2]→−1；[2,5]→3</text><text x="80" y="430" font-size="28" text-anchor="start" fill="#273749">完整输出：[2, −1, 3]</text></g></svg>