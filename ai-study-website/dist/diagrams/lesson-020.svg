<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">向量、形状与范数：一步图解</title><desc id="desc">先沿橙色折线走：右3、上4，总7；再看蓝色斜线：两端之间的直线长度是5。这个坐标例子帮助区分L1与L2。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">向量、形状与范数：一步图解</text><line x1="100" y1="100" x2="100" y2="340" stroke="#e5eaf1" stroke-width="1"/><line x1="160" y1="100" x2="160" y2="340" stroke="#e5eaf1" stroke-width="1"/><line x1="220" y1="100" x2="220" y2="340" stroke="#e5eaf1" stroke-width="1"/><line x1="280" y1="100" x2="280" y2="340" stroke="#e5eaf1" stroke-width="1"/><line x1="340" y1="100" x2="340" y2="340" stroke="#e5eaf1" stroke-width="1"/><line x1="400" y1="100" x2="400" y2="340" stroke="#e5eaf1" stroke-width="1"/><line x1="100" y1="100" x2="400" y2="100" stroke="#e5eaf1" stroke-width="1"/><line x1="100" y1="160" x2="400" y2="160" stroke="#e5eaf1" stroke-width="1"/><line x1="100" y1="220" x2="400" y2="220" stroke="#e5eaf1" stroke-width="1"/><line x1="100" y1="280" x2="400" y2="280" stroke="#e5eaf1" stroke-width="1"/><line x1="100" y1="340" x2="400" y2="340" stroke="#e5eaf1" stroke-width="1"/><line x1="100" y1="340" x2="430" y2="340" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="100" y1="340" x2="100" y2="75" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="100" y1="340" x2="280" y2="340" stroke="#ed9a2d" stroke-width="7"/><line x1="280" y1="340" x2="280" y2="100" stroke="#ed9a2d" stroke-width="7"/><line x1="100" y1="340" x2="280" y2="100" stroke="#2563eb" stroke-width="6"/><text x="190" y="378" font-size="26" text-anchor="middle" fill="#273749">向右 3</text><text x="310" y="220" font-size="26" text-anchor="start" fill="#273749">向上 4</text><text x="205" y="192" font-size="26" text-anchor="middle" fill="#2563eb">直线 5</text><text x="460" y="135" font-size="27" text-anchor="start" fill="#273749">L1：3 + 4 = 7</text><text x="460" y="235" font-size="27" text-anchor="start" fill="#273749">L2：√(9 + 16) = 5</text><text x="100" y="415" font-size="23" text-anchor="start" fill="#273749">同一终点：沿街区走 7 格，直线距离 5 格</text></g></svg>