<svg xmlns="http://www.w3.org/2000/svg" width="760" height="474" viewBox="0 0 760 474" role="img" aria-labelledby="title desc"><title id="title">一次前向加噪分成两份</title><desc id="desc">这里只演示已知加噪，不是训练好的逆向生成器。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="474" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">一次前向加噪分成两份</text><rect x="40.0" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="117" font-size="24" text-anchor="start" fill="#273749">部分</text><rect x="266.66666666666663" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="117" font-size="24" text-anchor="start" fill="#273749">计算</text><rect x="493.3333333333333" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="117" font-size="24" text-anchor="start" fill="#273749">贡献</text><rect x="40.0" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="177" font-size="24" text-anchor="start" fill="#273749">原信号</text><rect x="266.66666666666663" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="177" font-size="24" text-anchor="start" fill="#273749">√0.8 × 2</text><rect x="493.3333333333333" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="177" font-size="24" text-anchor="start" fill="#273749">≈1.7889</text><rect x="40.0" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="245" font-size="24" text-anchor="start" fill="#273749">噪声</text><rect x="266.66666666666663" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="245" font-size="24" text-anchor="start" fill="#273749">√0.2 × (−1)</text><rect x="493.3333333333333" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="245" font-size="24" text-anchor="start" fill="#273749">≈−0.4472</text><rect x="40.0" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="313" font-size="24" text-anchor="start" fill="#273749">混合结果</text><rect x="266.66666666666663" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="313" font-size="24" text-anchor="start" fill="#273749">两项相加</text><rect x="493.3333333333333" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="313" font-size="24" text-anchor="start" fill="#273749">≈1.3416</text><text x="40" y="419" font-size="24" text-anchor="start" fill="#273749">这里只演示已知加噪，不是训练好的逆向生成器。</text></g></svg>