<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">神经元、MLP 与非线性：一步图解</title><desc id="desc">左边是两个输入，中间两个框分别加权求和并把负数变0，右边把隐藏值相加。箭头表示数据流动，不是训练已经完成。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">神经元、MLP 与非线性：一步图解</text><circle cx="105" cy="140" r="45" fill="#e8f0fd"/><text x="105" y="148" font-size="23" text-anchor="middle" fill="#273749">输入2</text><circle cx="105" cy="325" r="45" fill="#e8f0fd"/><text x="105" y="333" font-size="23" text-anchor="middle" fill="#273749">输入−1</text><rect x="320" y="92" width="195" height="90" rx="5" fill="#e8f5ed" stroke="#b8c6d6" stroke-width="2"/><text x="418" y="132" font-size="23" text-anchor="middle" fill="#273749">权重 [1, 1]</text><text x="418" y="165" font-size="25" text-anchor="middle" fill="#273749">ReLU后1</text><line x1="155" y1="140" x2="310" y2="130" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="155" y1="325" x2="310" y2="150" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="277" width="195" height="90" rx="5" fill="#e8f5ed" stroke="#b8c6d6" stroke-width="2"/><text x="418" y="317" font-size="23" text-anchor="middle" fill="#273749">权重 [−1, 1]</text><text x="418" y="350" font-size="25" text-anchor="middle" fill="#273749">ReLU后0</text><line x1="155" y1="140" x2="310" y2="315" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="155" y1="325" x2="310" y2="335" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="655" cy="232" r="56" fill="#fff1dd"/><text x="655" y="225" font-size="25" text-anchor="middle" fill="#273749">求和</text><text x="655" y="262" font-size="24" text-anchor="middle" fill="#273749">1+0=1</text><line x1="525" y1="140" x2="592" y2="205" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="525" y1="325" x2="592" y2="260" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="435" font-size="25" text-anchor="start" fill="#273749">同一个输入先形成两个隐藏结果，再合成输出。</text></g></svg>