<svg xmlns="http://www.w3.org/2000/svg" width="760" height="474" viewBox="0 0 760 474" role="img" aria-labelledby="title desc"><title id="title">绿色的one-hot编码</title><desc id="desc">词表顺序固定，只有绿色对应的位置亮为1。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="474" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">绿色的one-hot编码</text><rect x="40.0" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="117" font-size="24" text-anchor="start" fill="#273749">候选位置</text><rect x="266.66666666666663" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="117" font-size="24" text-anchor="start" fill="#273749">比较是否为绿</text><rect x="493.3333333333333" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="117" font-size="24" text-anchor="start" fill="#273749">编码</text><rect x="40.0" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="177" font-size="24" text-anchor="start" fill="#273749">红</text><rect x="266.66666666666663" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="177" font-size="24" text-anchor="start" fill="#273749">False</text><rect x="493.3333333333333" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="177" font-size="24" text-anchor="start" fill="#273749">0</text><rect x="40.0" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="245" font-size="24" text-anchor="start" fill="#273749">绿</text><rect x="266.66666666666663" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="245" font-size="24" text-anchor="start" fill="#273749">True</text><rect x="493.3333333333333" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="245" font-size="24" text-anchor="start" fill="#273749">1</text><rect x="40.0" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="313" font-size="24" text-anchor="start" fill="#273749">蓝</text><rect x="266.66666666666663" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="313" font-size="24" text-anchor="start" fill="#273749">False</text><rect x="493.3333333333333" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="313" font-size="24" text-anchor="start" fill="#273749">0</text><text x="40" y="419" font-size="24" text-anchor="start" fill="#273749">词表顺序固定，只有绿色对应的位置亮为1。</text></g></svg>