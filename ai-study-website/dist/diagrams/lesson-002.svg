<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">变量与数据类型：一步图解</title><desc id="desc">左边是变量名，右边是它现在对应的值。数字25没有引号，文字Python有引号；名字和内容要分开看。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">变量与数据类型：一步图解</text><rect x="45" y="110" width="230" height="80" rx="5" fill="#eff6ff" stroke="#b8c6d6" stroke-width="2"/><text x="160" y="160" font-size="29" text-anchor="middle" fill="#273749">minutes</text><line x1="280" y1="150" x2="390" y2="150" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="110" width="300" height="80" rx="5" fill="#f4f7fb" stroke="#b8c6d6" stroke-width="2"/><text x="550" y="160" font-size="27" text-anchor="middle" fill="#273749">25（整数）</text><rect x="45" y="245" width="230" height="80" rx="5" fill="#eff6ff" stroke="#b8c6d6" stroke-width="2"/><text x="160" y="295" font-size="29" text-anchor="middle" fill="#273749">subject</text><line x1="280" y1="285" x2="390" y2="285" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="245" width="300" height="80" rx="5" fill="#f4f7fb" stroke="#b8c6d6" stroke-width="2"/><text x="550" y="295" font-size="27" text-anchor="middle" fill="#273749">&quot;Python&quot;（文字）</text><text x="55" y="420" font-size="26" text-anchor="start" fill="#273749">名字指向值；读取名字时取得它当前的值。</text></g></svg>