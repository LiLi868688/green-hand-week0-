<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc"><title id="title">决策树、信息增益与剪枝：输入怎样变成结果</title><desc id="desc">从上到下阅读。上框给出当前示例输入，中框是计算规则，下框是实际执行结果。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="590" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">决策树、信息增益与剪枝：输入怎样变成结果</text><rect x="30" y="80" width="700" height="140" rx="5" fill="#eff6ff" stroke="#b8c6d6" stroke-width="2"/><text x="50" y="115" font-size="24" text-anchor="start" fill="#273749">① 输入：先准备这些信息</text><text x="50" y="157" font-size="23" text-anchor="start" fill="#273749">labels = [0, 0, 1, 1]</text><rect x="30" y="250" width="700" height="140" rx="5" fill="#f3f6fb" stroke="#b8c6d6" stroke-width="2"/><text x="50" y="285" font-size="24" text-anchor="start" fill="#273749">② 操作：按这条规则处理</text><text x="50" y="327" font-size="23" text-anchor="start" fill="#273749">先算每类比例，再分别平方，最后用1减去平方和</text><rect x="30" y="420" width="700" height="140" rx="5" fill="#edf8f1" stroke="#b8c6d6" stroke-width="2"/><text x="50" y="455" font-size="24" text-anchor="start" fill="#273749">③ 输出：实际运行得到</text><text x="50" y="497" font-size="23" text-anchor="start" fill="#273749">0.5；0.0</text><line x1="380" y1="222" x2="380" y2="246" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="380" y1="392" x2="380" y2="416" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/></g></svg>