ke-width="2"/><text x="55.0" y="245" font-size="24" text-anchor="start" fill="#273749">权重平方和</text><rect x="266.66666666666663" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="245" font-size="24" text-anchor="start" fill="#273749">3²+4²</text><rect x="493.3333333333333" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="245" font-size="24" text-anchor="start" fill="#273749">25</text><rect x="40.0" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="313" font-size="24" text-anchor="start" fill="#273749">L2惩罚</text><rect x="266.66666666666663" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="313" font-size="24" text-anchor="start" fill="#273749">0.1×25</text><rect x="493.3333333333333" y="274" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="313" font-size="24" text-anchor="start" fill="#273749">2.5</text><rect x="40.0" y="342" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="381" font-size="24" text-anchor="start" fill="#273749">合并目标</text><rect x="266.66666666666663" y="342" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="381" font-size="24" text-anchor="start" fill="#273749">2.0+2.5</text><rect x="493.3333333333333" y="342" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="381" font-size="24" text-anchor="start" fill="#273749">4.5</text><text x="40" y="487" font-size="24" text-anchor="start" fill="#273749">比较目标前先确认是否包含惩罚项，以及惩罚定义。</text></g></svg>