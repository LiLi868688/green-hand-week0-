<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-labelledby="title desc"><title id="title">成功与失败次数</title><desc id="desc">5次观测中成功3次，估计概率3/5=0.6，不是证明真实概率。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="416" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">成功与失败次数</text><line x1="270" y1="80" x2="270" y2="209" stroke="#bac6d2" stroke-width="2"/><text x="40" y="127" font-size="24" text-anchor="start" fill="#273749">成功</text><rect x="270" y="100" width="300.0" height="36" rx="2" fill="#78a9ed" stroke="#ffffff" stroke-width="2"/><text x="579.0" y="127" font-size="23" text-anchor="start" fill="#273749">3.0</text><text x="40" y="184" font-size="24" text-anchor="start" fill="#273749">失败</text><rect x="270" y="157" width="200.0" height="36" rx="2" fill="#78a9ed" stroke="#ffffff" stroke-width="2"/><text x="479.0" y="184" font-size="23" text-anchor="start" fill="#273749">2.0</text><text x="40" y="356" font-size="24" text-anchor="start" fill="#273749">5次观测中成功3次，估计概率3/5=0.6，不是证明真实概率。</text></g></svg>