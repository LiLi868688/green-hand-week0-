<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">随机变量、期望与方差：一步图解</title><desc id="desc">先定位均值2，再看每个点偏离多少。两端偏差一负一正，但方差先平方，因此不会相互抵消。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">随机变量、期望与方差：一步图解</text><line x1="100" y1="200" x2="640" y2="200" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="180" cy="200" r="9" fill="#2563eb"/><text x="180" y="245" font-size="28" text-anchor="middle" fill="#273749">1</text><circle cx="360" cy="200" r="9" fill="#2563eb"/><text x="360" y="245" font-size="28" text-anchor="middle" fill="#273749">2</text><circle cx="540" cy="200" r="9" fill="#2563eb"/><text x="540" y="245" font-size="28" text-anchor="middle" fill="#273749">3</text><text x="360" y="155" font-size="28" text-anchor="middle" fill="#273749">均值 2</text><line x1="180" y1="295" x2="360" y2="295" stroke="#e38a2b" stroke-width="4"/><line x1="360" y1="295" x2="540" y2="295" stroke="#e38a2b" stroke-width="4"/><text x="265" y="335" font-size="25" text-anchor="middle" fill="#273749">偏差 −1</text><text x="450" y="335" font-size="25" text-anchor="middle" fill="#273749">偏差 +1</text><text x="80" y="405" font-size="27" text-anchor="start" fill="#273749">平方后不抵消：(1 + 0 + 1) ÷ 3 = 2/3</text></g></svg>