<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">k 近邻与距离度量：在数轴上看距离</title><desc id="desc">查询3到2的距离1；到1与5的距离都2。并列按原样本顺序。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="450" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">k 近邻与距离度量：在数轴上看距离</text><line x1="80" y1="240" x2="700" y2="240" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="150" cy="240" r="11" fill="#2563eb"/><text x="150" y="290" font-size="29" text-anchor="middle" fill="#273749">1</text><circle cx="210" cy="240" r="11" fill="#2563eb"/><text x="210" y="290" font-size="29" text-anchor="middle" fill="#273749">2</text><circle cx="390" cy="240" r="11" fill="#e69334"/><text x="390" y="290" font-size="29" text-anchor="middle" fill="#273749">5</text><line x1="270" y1="120" x2="270" y2="220" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="270" y="95" font-size="27" text-anchor="middle" fill="#273749">查询3</text></g></svg>