<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">字典与集合：一步图解</title><desc id="desc">字典显示键到值的对应，集合显示不同元素。不要仅凭花括号就认为它们是相同容器。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">字典与集合：一步图解</text><rect x="50" y="110" width="300" height="120" rx="5" fill="#eff6ff" stroke="#b8c6d6" stroke-width="2"/><text x="75" y="155" font-size="26" text-anchor="start" fill="#273749">字典：按名字找值</text><text x="75" y="205" font-size="30" text-anchor="start" fill="#273749">Python → 30</text><rect x="405" y="110" width="300" height="120" rx="5" fill="#e5f4ea" stroke="#b8c6d6" stroke-width="2"/><text x="430" y="155" font-size="26" text-anchor="start" fill="#273749">集合：重复只留一份</text><text x="430" y="205" font-size="29" text-anchor="start" fill="#273749">{基础, 练习}</text><text x="60" y="320" font-size="27" text-anchor="start" fill="#273749">取值：record.get(&quot;Python&quot;,0) → 30</text><text x="60" y="390" font-size="27" text-anchor="start" fill="#273749">标签写了3次，但不同标签只有2个。</text></g></svg>