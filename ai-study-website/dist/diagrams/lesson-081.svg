<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">Q、K、V 与缩放点积注意力：一步图解</title><desc id="desc">先用Q与K比较得到权重，再用权重乘V汇总。匹配更高的第一项占比更大；权重本身不是被返回的内容。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">Q、K、V 与缩放点积注意力：一步图解</text><rect x="225" y="75" width="310" height="60" rx="5" fill="#eff6ff" stroke="#b8c6d6" stroke-width="2"/><text x="380" y="115" font-size="26" text-anchor="middle" fill="#273749">查询 Q = [1, 0]</text><line x1="380" y1="138" x2="185" y2="177" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="180" width="320" height="145" rx="5" fill="#f4f7fb" stroke="#b8c6d6" stroke-width="2"/><text x="190" y="215" font-size="26" text-anchor="middle" fill="#273749">K₁=[1,0]</text><text x="190" y="260" font-size="26" text-anchor="middle" fill="#273749">权重 ≈ 0.6698</text><text x="190" y="300" font-size="26" text-anchor="middle" fill="#273749">取值 V = 10</text><line x1="190" y1="328" x2="380" y2="370" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="380" y1="138" x2="565" y2="177" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="410" y="180" width="320" height="145" rx="5" fill="#f4f7fb" stroke="#b8c6d6" stroke-width="2"/><text x="570" y="215" font-size="26" text-anchor="middle" fill="#273749">K₂=[0,1]</text><text x="570" y="260" font-size="26" text-anchor="middle" fill="#273749">权重 ≈ 0.3302</text><text x="570" y="300" font-size="26" text-anchor="middle" fill="#273749">取值 V = 20</text><line x1="570" y1="328" x2="380" y2="370" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="375" width="600" height="75" rx="5" fill="#edf8f1" stroke="#b8c6d6" stroke-width="2"/><text x="380" y="421" font-size="25" text-anchor="middle" fill="#273749">0.6698×10 + 0.3302×20 ≈ 13.3024</text></g></svg>