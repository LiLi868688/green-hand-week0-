<svg xmlns="http://www.w3.org/2000/svg" width="760" height="474" viewBox="0 0 760 474" role="img" aria-labelledby="title desc"><title id="title">结构能读还要检查值</title><desc id="desc">三道检查各有含义；格式正确不等于事实正确。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="474" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">结构能读还要检查值</text><rect x="40.0" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="117" font-size="24" text-anchor="start" fill="#273749">检查</text><rect x="266.66666666666663" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="117" font-size="24" text-anchor="start" fill="#273749">本例输入</text><rect x="493.3333333333333" y="80" width="226.66666666666666" height="58" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="117" font-size="24" text-anchor="start" fill="#273749">是否通过</text><rect x="40.0" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="55.0" y="177" font-size="24" text-anchor="start" fill="#273749">JSON解析</text><rect x="266.66666666666663" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="281.66666666666663" y="177" font-size="24" text-anchor="start" fill="#273749">对象文字</text><rect x="493.3333333333333" y="138" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d6" stroke-width="2"/><text x="508.3333333333333" y="177" font-size="24" text-anchor="start" fill="#273749">通过</text><rect x="40.0" y="206" width="226.66666666666666" height="68" rx="5" fill="#ffffff" stroke="#b8c6d