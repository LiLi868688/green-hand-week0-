<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">k-means 与聚类中心：在数轴上看距离</title><desc id="desc">蓝色1、2在一组，橙色8、9在另一组；各组均值成为新中心。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="450" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">k-means 与聚类中心：在数轴上看距离</text><line x1="80" y1="240" x2="700" y2="240" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="150" cy="240" r="11" fill="#2563eb"/><text x="150" y="290" font-size="29" text-anchor="middle" fill="#273749">1</text><circle cx="210" cy="240" r="11" fill="#2563eb"/><text x="210" y="290" font-size="29" text-anchor="middle" fill="#273749">2</text><circle cx="570" cy="240" r="11" fill="#e69334"/><text x="570" y="290" font-size="29" text-anchor="middle" fill="#273749">8</text><circle cx="630" cy="240" r="11" fill="#e69334"/><text x="630" y="290" font-size="29" text-anchor="middle" fill="#273749">9</text><line x1="180.0" y1="330" x2="180.0" y2="260" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="180.0" y="380" font-size="25" text-anchor="middle" fill="#273749">新中心1.5</text><line x1="600.0" y1="330" x2="600.0" y2="260" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="600.0" y="380" font-size="25" text-anchor="middle" fill="#273749">新中心8.5</text></g></svg>