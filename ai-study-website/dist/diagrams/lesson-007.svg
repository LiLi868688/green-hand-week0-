<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">列表与元组：一步图解</title><desc id="desc">横向格子表示列表顺序；下方编号从0开始。绿色是追加的新项，原来三项仍在。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">列表与元组：一步图解</text><rect x="65" y="140" width="145" height="90" rx="5" fill="#eff6ff" stroke="#b8c6d6" stroke-width="2"/><text x="137" y="197" font-size="35" text-anchor="middle" fill="#273749">15</text><text x="137" y="280" font-size="26" text-anchor="middle" fill="#273749">索引 0</text><rect x="240" y="140" width="145" height="90" rx="5" fill="#eff6ff" stroke="#b8c6d6" stroke-width="2"/><text x="312" y="197" font-size="35" text-anchor="middle" fill="#273749">20</text><text x="312" y="280" font-size="26" text-anchor="middle" fill="#273749">索引 1</text><rect x="415" y="140" width="145" height="90" rx="5" fill="#eff6ff" stroke="#b8c6d6" stroke-width="2"/><text x="487" y="197" font-size="35" text-anchor="middle" fill="#273749">25</text><text x="487" y="280" font-size="26" text-anchor="middle" fill="#273749">索引 2</text><rect x="590" y="140" width="145" height="90" rx="5" fill="#e5f4ea" stroke="#b8c6d6" stroke-width="2"/><text x="662" y="197" font-size="35" text-anchor="middle" fill="#273749">30</text><text x="662" y="280" font-size="26" text-anchor="middle" fill="#273749">索引 3</text><text x="65" y="105" font-size="28" text-anchor="start" fill="#273749">append(30) 后的列表</text><text x="65" y="350" font-size="27" text-anchor="start" fill="#273749">最后一项也可用索引 −1 读取 → 30</text><text x="65" y="415" font-size="27" text-anchor="start" fill="#273749">sum：15 + 20 + 25 + 30 = 90</text></g></svg>