<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">循环与范围：一步图解</title><desc id="desc">按行从第一次往下读。新值会成为下一次的旧值，不会每轮重新回到0；print在循环外，所以只显示最后结果。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">循环与范围：一步图解</text><text x="70" y="100" font-size="27" text-anchor="start" fill="#273749">total先准备为0；每次都在旧值上加20。</text><rect x="65" y="112" width="630" height="42" rx="5" fill="#f3f7fc" stroke="#b8c6d6" stroke-width="2"/><text x="85" y="140" font-size="25" text-anchor="start" fill="#273749">第1次</text><text x="240" y="140" font-size="25" text-anchor="start" fill="#273749">0 + 20</text><text x="475" y="140" font-size="25" text-anchor="start" fill="#273749">→ 20</text><rect x="65" y="160" width="630" height="42" rx="5" fill="#f3f7fc" stroke="#b8c6d6" stroke-width="2"/><text x="85" y="188" font-size="25" text-anchor="start" fill="#273749">第2次</text><text x="240" y="188" font-size="25" text-anchor="start" fill="#273749">20 + 20</text><text x="475" y="188" font-size="25" text-anchor="start" fill="#273749">→ 40</text><rect x="65" y="208" width="630" height="42" rx="5" fill="#f3f7fc" stroke="#b8c6d6" stroke-width="2"/><text x="85" y="236" font-size="25" text-anchor="start" fill="#273749">第3次</text><text x="240" y="236" font-size="25" text-anchor="start" fill="#273749">40 + 20</text><text x="475" y="236" font-size="25" text-anchor="start" fill="#273749">→ 60</text><rect x="65" y="256" width="630" height="42" rx="5" fill="#f3f7fc" stroke="#b8c6d6" stroke-width="2"/><text x="85" y="284" font-size="25" text-anchor="start" fill="#273749">第4次</text><text x="240" y="284" font-size="25" text-anchor="start" fill="#273749">60 + 20</text><text x="475" y="284" font-size="25" text-anchor="start" fill="#273749">→ 80</text><rect x="65" y="304" width="630" height="42" rx="5" fill="#f3f7fc" stroke="#b8c6d6" stroke-width="2"/><text x="85" y="332" font-size="25" text-anchor="start" fill="#273749">第5次</text><text x="240" y="332" font-size="25" text-anchor="start" fill="#273749">80 + 20</text><text x="475" y="332" font-size="25" text-anchor="start" fill="#273749">→ 100</text><text x="70" y="425" font-size="28" text-anchor="start" fill="#273749">循环外print一次：100</text></g></svg>