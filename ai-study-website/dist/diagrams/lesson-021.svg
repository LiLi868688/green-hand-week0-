<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">点积、夹角与余弦相似度：一步图解</title><desc id="desc">两支箭头从同一原点出发。蓝色向右，橙色右上；余弦在比较方向，而不是把0.7071当作可信度。图为方向示意，采用相同横纵单位比例。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">点积、夹角与余弦相似度：一步图解</text><line x1="100" y1="340" x2="640" y2="340" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="100" y1="340" x2="100" y2="90" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="100" y1="340" x2="340" y2="340" stroke="#2563eb" stroke-width="7"/><line x1="100" y1="340" x2="340" y2="100" stroke="#e38a2b" stroke-width="7"/><text x="440" y="340" font-size="26" text-anchor="start" fill="#273749">a = [1, 0]</text><text x="425" y="100" font-size="26" text-anchor="start" fill="#273749">b = [1, 1]</text><path d="M180 340 A80 80 0 0 0 164 292" fill="none" stroke="#64748b" stroke-width="3"/><text x="210" y="300" font-size="24" text-anchor="start" fill="#273749">方向夹角</text><text x="80" y="410" font-size="23" text-anchor="start" fill="#273749">点积 1；长度 1 和 √2；余弦 = 1 / √2 ≈ 0.7071</text></g></svg>