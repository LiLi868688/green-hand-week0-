<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">MDP、策略与折扣回报：一步图解</title><desc id="desc">从左到右是时间。奖励分别为1、2、3，但折扣系数分别1、0.5、0.25；先逐项相乘再求和。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">MDP、策略与折扣回报：一步图解</text><circle cx="140" cy="150" r="35" fill="#e5efff"/><text x="140" y="160" font-size="30" text-anchor="middle" fill="#273749">1</text><text x="140" y="230" font-size="28" text-anchor="middle" fill="#273749">× 1</text><text x="140" y="290" font-size="25" text-anchor="middle" fill="#273749">贡献 1</text><line x1="185" y1="150" x2="330" y2="150" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="380" cy="150" r="35" fill="#e5efff"/><text x="380" y="160" font-size="30" text-anchor="middle" fill="#273749">2</text><text x="380" y="230" font-size="28" text-anchor="middle" fill="#273749">× 0.5</text><text x="380" y="290" font-size="25" text-anchor="middle" fill="#273749">贡献 1.0</text><line x1="425" y1="150" x2="570" y2="150" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="620" cy="150" r="35" fill="#e5efff"/><text x="620" y="160" font-size="30" text-anchor="middle" fill="#273749">3</text><text x="620" y="230" font-size="28" text-anchor="middle" fill="#273749">× 0.25</text><text x="620" y="290" font-size="25" text-anchor="middle" fill="#273749">贡献 0.75</text><text x="380" y="390" font-size="31" text-anchor="middle" fill="#273749">1 + 1 + 0.75 = 2.75</text></g></svg>