<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">训练验证测试划分与泄漏：一步图解</title><desc id="desc">每个格子是一条按时间排列的记录。蓝色用于训练，橙色选设置，绿色留作最终评估；未来数据不能倒流进入过去的训练。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">训练验证测试划分与泄漏：一步图解</text><rect x="45" y="155" width="58" height="85" rx="5" fill="#dcecff" stroke="#b8c6d6" stroke-width="2"/><text x="74" y="208" font-size="29" text-anchor="middle" fill="#273749">1</text><rect x="111" y="155" width="58" height="85" rx="5" fill="#dcecff" stroke="#b8c6d6" stroke-width="2"/><text x="140" y="208" font-size="29" text-anchor="middle" fill="#273749">2</text><rect x="177" y="155" width="58" height="85" rx="5" fill="#dcecff" stroke="#b8c6d6" stroke-width="2"/><text x="206" y="208" font-size="29" text-anchor="middle" fill="#273749">3</text><rect x="243" y="155" width="58" height="85" rx="5" fill="#dcecff" stroke="#b8c6d6" stroke-width="2"/><text x="272" y="208" font-size="29" text-anchor="middle" fill="#273749">4</text><rect x="309" y="155" width="58" height="85" rx="5" fill="#dcecff" stroke="#b8c6d6" stroke-width="2"/><text x="338" y="208" font-size="29" text-anchor="middle" fill="#273749">5</text><rect x="375" y="155" width="58" height="85" rx="5" fill="#dcecff" stroke="#b8c6d6" stroke-width="2"/><text x="404" y="208" font-size="29" text-anchor="middle" fill="#273749">6</text><rect x="441" y="155" width="58" height="85" rx="5" fill="#fff0dd" stroke="#b8c6d6" stroke-width="2"/><text x="470" y="208" font-size="29" text-anchor="middle" fill="#273749">7</text><rect x="507" y="155" width="58" height="85" rx="5" fill="#fff0dd" stroke="#b8c6d6" stroke-width="2"/><text x="536" y="208" font-size="29" text-anchor="middle" fill="#273749">8</text><rect x="573" y="155" width="58" height="85" rx="5" fill="#e5f4ea" stroke="#b8c6d6" stroke-width="2"/><text x="602" y="208" font-size="29" text-anchor="middle" fill="#273749">9</text><rect x="639" y="155" width="58" height="85" rx="5" fill="#e5f4ea" stroke="#b8c6d6" stroke-width="2"/><text x="668" y="208" font-size="29" text-anchor="middle" fill="#273749">10</text><text x="230" y="295" font-size="27" text-anchor="middle" fill="#273749">训练：1—6</text><text x="475" y="295" font-size="25" text-anchor="middle" fill="#273749">验证：7—8</text><text x="645" y="295" font-size="25" text-anchor="middle" fill="#273749">测试：9—10</text><line x1="60" y1="355" x2="710" y2="355" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="405" font-size="25" text-anchor="middle" fill="#273749">时间从过去 → 未来；划分后再拟合预处理</text></g></svg>