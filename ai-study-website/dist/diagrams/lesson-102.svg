<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">一轮邻居消息聚合</title><desc id="desc">先读取所有旧节点值，再同时形成聚合结果[3,3,3]。边表示允许交换的信息。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="450" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">一轮邻居消息聚合</text><line x1="195" y1="170" x2="335" y2="170" stroke="#64748b" stroke-width="4"/><line x1="425" y1="170" x2="565" y2="170" stroke="#64748b" stroke-width="4"/><circle cx="150" cy="170" r="45" fill="#dceaff"/><text x="150" y="180" font-size="32" text-anchor="middle" fill="#273749">1</text><text x="150" y="250" font-size="25" text-anchor="middle" fill="#273749">节点0</text><circle cx="380" cy="170" r="45" fill="#dceaff"/><text x="380" y="180" font-size="32" text-anchor="middle" fill="#273749">3</text><text x="380" y="250" font-size="25" text-anchor="middle" fill="#273749">节点1</text><circle cx="610" cy="170" r="45" fill="#dceaff"/><text x="610" y="180" font-size="32" text-anchor="middle" fill="#273749">5</text><text x="610" y="250" font-size="25" text-anchor="middle" fill="#273749">节点2</text><text x="380" y="330" font-size="26" text-anchor="middle" fill="#273749">中间节点读两端： (1+5)/2 = 3</text><text x="380" y="395" font-size="26" text-anchor="middle" fill="#273749">两端各读中间：都得到3</text></g></svg>