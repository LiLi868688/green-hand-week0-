<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc"><title id="title">输入与类型转换：一步图解</title><desc id="desc">从上到下看类型怎样改变：输入15时先是文字，int转换后才得到数字15。最后乘法产生900。引号表示文字边界，不是输出的一部分。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="540" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">输入与类型转换：一步图解</text><rect x="55" y="85" width="650" height="115" rx="5" fill="#eff6ff" stroke="#b8c6d6" stroke-width="2"/><text x="80" y="125" font-size="27" text-anchor="start" fill="#273749">① 输入框先交出文字</text><text x="80" y="170" font-size="28" text-anchor="start" fill="#273749">&quot;15&quot;：这是字符串</text><rect x="55" y="240" width="650" height="115" rx="5" fill="#f2f7f4" stroke="#b8c6d6" stroke-width="2"/><text x="80" y="280" font-size="27" text-anchor="start" fill="#273749">② int把文字读成整数</text><text x="80" y="325" font-size="28" text-anchor="start" fill="#273749">15：现在是可以计算的数</text><rect x="55" y="395" width="650" height="115" rx="5" fill="#f2f7f4" stroke="#b8c6d6" stroke-width="2"/><text x="80" y="435" font-size="27" text-anchor="start" fill="#273749">③ 乘60，再显示</text><text x="80" y="480" font-size="28" text-anchor="start" fill="#273749">15 × 60 = 900 秒</text><line x1="380" y1="204" x2="380" y2="235" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="380" y1="359" x2="380" y2="389" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/></g></svg>