<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">LoRA、低秩更新与参数效率：一步图解</title><desc id="desc">左图是原矩阵，右图是两个薄因子，用于描述增量。减少的是可训练增量参数，不能把基座模型从总内存里删掉。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="760" height="460" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#273749">LoRA、低秩更新与参数效率：一步图解</text><rect x="60" y="100" width="260" height="245" rx="5" fill="#e7effb" stroke="#b8c6d6" stroke-width="2"/><text x="190" y="155" font-size="28" text-anchor="middle" fill="#273749">原权重</text><text x="190" y="215" font-size="28" text-anchor="middle" fill="#273749">1000 × 1000</text><text x="190" y="280" font-size="25" text-anchor="middle" fill="#273749">1,000,000个数</text><rect x="385" y="110" width="55" height="225" rx="5" fill="#e8f5ee" stroke="#b8c6d6" stroke-width="2"/><rect x="480" y="110" width="220" height="55" rx="5" fill="#e8f5ee" stroke="#b8c6d6" stroke-width="2"/><text x="460" y="245" font-size="24" text-anchor="start" fill="#273749">1000×8</text><text x="460" y="290" font-size="24" text-anchor="start" fill="#273749">再乘 8×1000</text><text x="380" y="375" font-size="24" text-anchor="start" fill="#273749">增量参数：8×(1000+1000)</text><text x="380" y="418" font-size="23" text-anchor="start" fill="#273749">= 16,000；原权重仍需保留</text></g></svg>